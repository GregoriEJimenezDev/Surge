<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hola Mundo — Surge CI/CD</title>
  <style>
    :root {
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      --bg: #f2f2f7;
      --card: rgba(255, 255, 255, 0.72);
      --text: #1c1c1e;
      --secondary: #6e6e73;
      --blue: #007aff;
      --green: #34c759;
      --separator: rgba(60, 60, 67, 0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      background: var(--card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 24px;
      padding: 36px 32px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(52, 199, 89, 0.12);
      border: 1px solid rgba(52, 199, 89, 0.25);
      color: #248a3d;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--green);
    }
    h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 10px;
      letter-spacing: -0.02em;
    }
    p {
      color: var(--secondary);
      font-size: 0.98rem;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    p strong { color: var(--text); }
    .btn {
      width: 100%;
      font-family: var(--font);
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 16px;
      padding: 14px;
      color: #ffffff;
      background: var(--blue);
      cursor: pointer;
      transition: transform 0.1s ease, filter 0.2s ease;
    }
    .btn:hover { filter: brightness(1.06); }
    .btn:active { transform: scale(0.98); }
    .status-msg {
      margin-top: 16px;
      font-size: 0.9rem;
      color: var(--text);
      font-weight: 600;
      min-height: 22px;
      border-top: 1px solid var(--separator);
      padding-top: 16px;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">
      <span class="dot"></span> Desplegado en Surge.sh
    </div>
    <h1>Hola Mundo - CI/CD</h1>
    <p>Desplegado automáticamente mediante <strong>GitHub Actions</strong>.</p>
    <button class="btn" id="btnSaludo">Saludar 👋</button>
    <div class="status-msg" id="mensaje"></div>
  </main>

  <script>
    const btn = document.getElementById('btnSaludo');
    const msg = document.getElementById('mensaje');
    let clicks = 0;

    btn.addEventListener('click', () => {
      clicks++;
      msg.textContent = clicks === 1
        ? '👋 ¡Hola! Cambios sincronizados con CI/CD.'
        : `👋 ¡Hola de nuevo! (${clicks} clics)`;
    });
  </script>
</body>
</html>
