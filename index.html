<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0a0a2e" />
<title>Hola Mundo - CI/CD</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
min-height:100dvh;display:grid;place-items:center;padding:24px 16px;
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;
color:#fff;background:linear-gradient(135deg,#0a0a2e,#1b1b6b,#5e2b97,#b83a8e);
background-size:300% 300%;animation:fondo 15s ease-in-out infinite;
-webkit-font-smoothing:antialiased;
}
@keyframes fondo{0%{background-position:0% 20%}50%{background-position:100% 80%}100%{background-position:0% 20%}}
.card{
width:100%;max-width:440px;text-align:center;padding:32px 28px;
background:rgba(255,255,255,.14);
-webkit-backdrop-filter:blur(20px) saturate(160%);
backdrop-filter:blur(20px) saturate(160%);
border:1px solid rgba(255,255,255,.3);
border-radius:24px;
box-shadow:0 24px 60px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.35);
}
.badge{
display:inline-flex;align-items:center;gap:8px;
font-size:13px;font-weight:600;padding:8px 14px;border-radius:999px;
background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.25);margin-bottom:18px;
}
.dot{width:9px;height:9px;border-radius:50%;background:#30d158;box-shadow:0 0 0 4px rgba(48,209,88,.25);animation:pulsar 2s infinite}
@keyframes pulsar{50%{transform:scale(.8);opacity:.7}}
h1{font-size:clamp(30px,6vw,42px);letter-spacing:-.02em;line-height:1.1;margin-bottom:10px}
p{font-size:15px;color:rgba(255,255,255,.75);line-height:1.5;margin-bottom:22px}
.btn{
width:100%;padding:15px;border:none;cursor:pointer;border-radius:18px;
font-family:inherit;font-size:16px;font-weight:700;color:#fff;
background:linear-gradient(180deg,#0a84ff,#0066d6);
box-shadow:0 10px 28px rgba(10,132,255,.45),inset 0 1px 0 rgba(255,255,255,.4);
transition:transform .12s ease,filter .2s ease;
}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.97)}
.msg{min-height:24px;margin-top:14px;font-size:15px;font-weight:600;opacity:0;transform:translateY(6px);transition:.3s}
.msg.show{opacity:1;transform:none}
@media(max-width:480px){.card{padding:26px 20px}}
@media(prefers-reduced-motion:reduce){body,.dot{animation:none}.btn,.msg{transition:none}}
</style>
</head>
<body>
<main class="card">
<div class="badge"><span class="dot"></span>Desplegado en Surge.sh</div>
<h1>Hola Mundo - CI/CD</h1>
<p>Push a <b>main</b> → GitHub Actions → Surge.sh</p>
<button class="btn" id="btn" type="button">Saludar 👋</button>
<p class="msg" id="msg" role="status"></p>
</main>
<script>
var n=0,btn=document.getElementById('btn'),msg=document.getElementById('msg');
btn.addEventListener('click',function(){
n++;
msg.textContent=n===1?'👋 ¡Hola Mundo desplegado con CI/CD!':'👋 ¡Hola de nuevo! '+n+' saludos.';
msg.classList.add('show');
clearTimeout(msg._t);
msg._t=setTimeout(function(){msg.classList.remove('show')},3000);
});
</script>
</body>
</html>
