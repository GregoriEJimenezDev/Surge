<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hola Mundo — Surge CI/CD</title>
  <style>
    :root {
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
      color: #ffffff;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 28px;
      padding: 36px 32px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.3);
      text-align: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #93c5fd;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #30d158;
      box-shadow: 0 0 10px #30d158;
    }
    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 10px;
      letter-spacing: -0.02em;
    }
    p {
      color: rgba(255, 255, 255, 0.75);
      font-size: 0.98rem;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn {
      width: 100%;
      font-family: var(--font);
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 16px;
      padding: 14px;
      color: #ffffff;
      background: linear-gradient(180deg, #0a84ff 0%, #0066d6 100%);
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 8px 20px rgba(10, 132, 255, 0.35);
      cursor: pointer;
      transition: transform 0.1s ease, filter 0.2s ease;
    }
    .btn:active {
      transform: scale(0.97);
    }
    .status-msg {
      margin-top: 16px;
      font-size: 0.9rem;
      color: #30d158;
      font-weight: 600;
      min-height: 22px;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">
      <span class="dot"></span> Surge.sh • LIVE
    </div>
    <h1>¡Hola Mundo! 🚀</h1>
    <p>Desplegado automáticamente mediante <strong>GitHub Actions</strong> con estilo iOS Glassmorphism.</p>
    <button class="btn" id="btnSaludo">Saludar 👋</button>
    <div class="status-msg" id="mensaje"></div>
  </main>

  <script>
    const btn = document.getElementById('btnSaludo');
    const msg = document.getElementById('mensaje');
    let clicks = 0;

    btn.addEventListener('click', () => {
      clicks++;
      msg.textContent = clicks === 1 
        ? '👋 ¡Hola! Cambios sincronizados con CI/CD.' 
        : `👋 ¡Hola de nuevo! (${clicks} clics)`;
    });
  </script>
</body>
</html>
